<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>

    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <script src="ink-theater.js"></script>
    <script src="paper-cut.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e8e0cf; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .stage { position: absolute; inset: 0; background: #e8e0cf; isolation: isolate; }
      .stage svg { position: absolute; inset: 0; display: block; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <section id="scene" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="stage" id="stage">
          <svg id="world-svg" data-paper-cut viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs></defs>
            <g id="world"></g>
          </svg>
          <svg id="over-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="540" cy="1000" r="1250">
                <stop offset="0.4" stop-color="#1f0d05" stop-opacity="0" />
                <stop offset="1" stop-color="#1f0d05" stop-opacity="0.33" />
              </radialGradient>
            </defs>
            <rect x="0" y="0" width="1080" height="1920" fill="url(#vignette)" />
            <rect id="fade" x="0" y="0" width="1080" height="1920" fill="#e8e0cf" opacity="1" />
          </svg>
        </div>
      </section>
    </div>

    <script>
      /*
       * "The paper factory", first 5 s: the shutter opens, the sun rolls out of the
       * factory onto the conveyor, pushed by the blue worker; the green worker beckons
       * ("come on, come on"); the red worker readies his paint roller.
       * Ported from a reference Python implementation (same timings, poses and camera).
       * The whole frame is a pure function of t (PaperCut.drive) => seek-safe.
       */
      window.__timelines = window.__timelines || {};
      var VARIANT = { shadow: "clones", grain: "raster" };   // bench switches: shadow clones|filter, grain raster|turbulence
      var DURATION = +document.getElementById("root").dataset.duration;   // one source of truth: data-duration
      var PC = window.PaperCut, IT = window.InkTheater, el = IT.el;
      PC.config.shadowMode = VARIANT.shadow;

      var W = 1080, H = 1920, D2R = Math.PI / 180;
      var FLOOR = 1480, BELT_Y = 1440, SUN_R = 95, FG_Y = 1668, JIB_Y = 640;
      var BANDS = ["#f7bd45", "#f39a3c", "#ef7360", "#e7678f", "#c56a9f", "#8f6fb1"], BAND_H = 222, BAND_TOP0 = 1330;
      var EV = { shutter: 0.5, roll0: 1.3, roll1: 4.0, paint0: 5.0, paint_step: 0.72, paint_dur: 0.62, trolley0: 9.8,
        hook_down: 10.6, latch: 11.3, lift0: 11.6, lift1: 13.0, release: 13.0, bump: 15.2, tip: 15.85, crash: 16.15 };
      var LOOK1 = { name: "w1", skin: "#f2c6a0", overall: "#3f7f9e", shirt: "#f4e9d8" };
      var LOOK2 = { name: "w2", skin: "#c98d63", overall: "#d4573f", shirt: "#f2d7a6", brow: "#3a2418" };
      var LOOK3 = { name: "w3", skin: "#f0b994", overall: "#5b8a4e", shirt: "#e9eef2", mustache: true, brow: "#6b4430" };
      var SUN_X0 = 325, SUN_X1 = 610, SUN_SKY_X = 540, SUN_SKY_Y = 826, BELT_SUN_Y = BELT_Y - SUN_R, HOOK_UP = JIB_Y + 70;
      function T(x, y, rotDeg, s) { return "translate(" + x.toFixed(2) + "," + y.toFixed(2) + ")" + (rotDeg ? " rotate(" + rotDeg.toFixed(3) + ")" : "") + (s != null && s !== 1 ? " scale(" + s.toFixed(4) + ")" : ""); }
      function g(parent, attrs) { var n = el("g", attrs || {}); parent.appendChild(n); return n; }
      function line(parent, pts, color, w, op) {

        parent.appendChild(p); return p;
      }
      function band_rect(i) { var y1 = BAND_TOP0 - BAND_H * i; return [y1 - BAND_H - 14, y1 + 14]; }

      // ------------------------------------------------------------- key poses
      var REST = [-12, -6, 12, 6], HIPS = [-45, 32, 45, -32], SHRUG = [-25, -128, 25, 128];
      var K1 = PC.keyed([
        [0.0, { x: 482, turn: 0.6, gaze: [1, 0], arms: [70, 85, 75, 88], lean: 8, mouth: "smile", brow: 0, shrug: 0, openHands: 0 }],
        [4.0, {}],
        [4.35, { arms: [-12, -6, 160, -135], lean: 0, turn: 0.2, gaze: [0, -0.3], mouth: "flat" }],
        [4.75, { arms: [-12, -6, 160, -125] }],
        [5.0, { arms: [-12, -6, 60, 165], turn: 0.6, gaze: [1, 0], mouth: "grin" }],
        [5.5, { arms: REST, turn: 0.0, gaze: [-0.3, -1], mouth: "o", brow: 0.6 }],
        [7.0, { gaze: [0.5, -1], mouth: "smile", brow: 0.2 }],
        [9.0, { x: 482, turn: 0.8, gaze: [1, -0.2] }],
        [9.8, { x: 800, turn: -0.4, gaze: [-0.5, -1], arms: [-12, -6, 30, 70] }],
        [13.4, {}],
        [13.8, { arms: HIPS, gaze: [-0.6, -1], mouth: "grin", turn: -0.4 }],
        [15.2, {}],
        [15.5, { turn: -0.7, gaze: [-1, 0.3], mouth: "o", brow: 0.6 }],
        [16.25, { gaze: [-0.6, -1], brow: 1.0, arms: [-30, -20, 30, 20] }],
        [18.0, {}],
        [18.4, { turn: -0.8, gaze: [-1, 0.5], mouth: "flat", brow: 0.3 }],
        [19.0, {}],
        [19.45, { arms: SHRUG, shrug: 1, openHands: 1, brow: 1, mouth: "wavy", turn: -0.4, gaze: [-0.7, 0.3] }],

      ]);
      var K2 = PC.keyed([
        [0.0, { x: 330, turn: 0.3, gaze: [1, -0.2], arms: [-12, -6, 20, 175], mouth: "smile", brow: 0, shrug: 0, lean: 0, openHands: 0 }],
        [4.3, {}],
        [9.9, { turn: 0.4, gaze: [0.7, -1] }],
        [13.6, {}],
        [14.0, { arms: [-12, -6, 150, 168], mouth: "grin", gaze: [0.6, -1], turn: 0.5 }],
        [14.45, {}],
        [14.7, { arms: [-60, 60, 60, -60] }],
        [15.25, {}],
        [15.5, { turn: 0.7, gaze: [1, 0.3], mouth: "o", brow: 0.6, arms: REST }],
        [16.2, { gaze: [0.2, -1], brow: 1.0, arms: [-40, -60, 40, 60] }],
        [18.0, {}],
        [18.4, { turn: 0.8, gaze: [1, 0], mouth: "flat", brow: 0.3, arms: REST }],
        [19.0, {}],
        [19.45, { arms: SHRUG, shrug: 1, openHands: 1, brow: 1, mouth: "wavy", turn: 0.5, gaze: [0.8, 0.2] }],
        [20.0, {}]
      ]);
      var K3 = PC.keyed([
        [0.0, { x: 730, turn: -0.6, gaze: [-1, 0], arms: REST, mouth: "smile", brow: 0, shrug: 0, lean: 0, openHands: 0 }],
        [1.3, { arms: [-70, -160, 12, 6], mouth: "grin" }],
        [3.8, {}],
        [4.1, { arms: [-60, -168, 12, 6] }],
        [4.8, { arms: REST }],
        [5.0, { mouth: "grin", brow: 0.4 }],
        [9.5, {}],
        [9.9, { arms: [-150, -175, 150, 175], gaze: [-0.4, -1], turn: -0.3, mouth: "smile" }],
        [13.0, {}],
        [13.4, { arms: REST }],
        [13.8, { arms: [-20, 70, 20, -70], gaze: [0.2, -1], turn: 0.4, mouth: "smile", brow: 0.3, lean: 3 }],
        [15.2, { x: 612 }],
        [15.3, { x: 630, mouth: "o", brow: 1.0, lean: -7, arms: [-150, -165, 150, 165] }],
        [15.6, { x: 735, turn: -0.9, gaze: [-1, 0.6], arms: [-30, 159, 30, -159], lean: 0 }],
        [16.1, {}],
        [16.35, { turn: -0.3, gaze: [-0.4, -1], arms: [-30, -40, 30, 40] }],
        [18.0, {}],
        [18.4, { turn: -0.9, gaze: [-1, 0.1], mouth: "flat", brow: 0.3, arms: REST }],
        [19.0, {}],
        [19.45, { arms: SHRUG, shrug: 1, openHands: 1, brow: 1, mouth: "wavy", turn: -0.5, gaze: [-0.8, 0.2] }],
        [20.0, {}]
      ]);
      function blink(t, off) { var ph = (t + off) % 3.4; return ph < 0.14 ? 1 - Math.abs(ph - 0.07) / 0.07 : 0; }
      function walkOf(x, v) { var w = clamp(Math.abs(v) / 60); return { legs: 22 * Math.sin(x / 15) * w, bob: -Math.abs(Math.sin(x / 15)) * 5 * w }; }
      function pose_at(keys, t, off) {
        var p = PC.sample(keys, t), v = (PC.sample(keys, t + 0.03).x - PC.sample(keys, t - 0.03).x) / 0.06, wk = walkOf(p.x, v);
        p.legs = wk.legs; p.bob = wk.bob; p.blink = blink(t, off); p.squash = 1 + 0.012 * Math.sin(t * 2.4 + off);
        return p;
      }

      // ------------------------------------------------------------- object states
      function sun_state(t) {
        var x = t < EV.roll0 ? SUN_X0 : lerp(SUN_X0, SUN_X1, E.io(prog(t, EV.roll0, EV.roll1)));
        var rot = (x - SUN_X0) / SUN_R, y = BELT_SUN_Y, power = 0.7, dim = 0;
        if (t >= EV.lift0) {
          var u = E.io5(prog(t, EV.lift0, EV.lift1)), sway = 16 * Math.sin(2 * Math.PI * 0.8 * (t - EV.lift0)) * Math.sin(Math.PI * clamp(u));
          x = lerp(SUN_X1, SUN_SKY_X, u) + sway; y = lerp(BELT_SUN_Y, SUN_SKY_Y + 34, u); rot += 0.06 * sway / 16;
        }
        if (t >= EV.release) {
          var f = E.out(prog(t, EV.release, EV.release + 0.8));
          y = lerp(SUN_SKY_Y + 34, SUN_SKY_Y, f) + 3 * Math.sin(2 * Math.PI * 0.5 * (t - EV.release));
          power = 0.7 + 0.9 * Math.sin(Math.PI * prog(t, EV.release, EV.release + 1.0)) + 0.3 * f;
        }
        if (t >= 17.0) {
          var s = E.io(prog(t, 17.0, 19.0));
          y = lerp(SUN_SKY_Y, 1430, s) + 3 * Math.sin(2 * Math.PI * 0.5 * (t - EV.release)) * (1 - s); dim = s; power *= 1 - 0.6 * s;
        }
        return { x: x, y: y, rot: rot, power: power, dim: dim, slot: t >= 13.6 ? "sky" : "mid" };
      }
      function crane_state(t) {
        var tx = 860;
        tx = lerp(tx, SUN_X1, E.io(prog(t, EV.trolley0, EV.hook_down)));
        tx = lerp(tx, SUN_SKY_X, E.io5(prog(t, EV.lift0, EV.lift1)));
        tx = lerp(tx, 860, E.io(prog(t, 13.4, 14.4)));
        var hy = HOOK_UP;
        hy = lerp(hy, BELT_SUN_Y - 118, E.io(prog(t, EV.hook_down, EV.latch)));
        hy = lerp(hy, SUN_SKY_Y + 34 - 118, E.io5(prog(t, EV.lift0, EV.lift1)));
        hy = lerp(hy, HOOK_UP - 10, E.io(prog(t, EV.release + 0.1, EV.release + 0.6)));
        var open = 1 - E.io(prog(t, EV.latch, EV.latch + 0.2)) + E.io(prog(t, EV.release, EV.release + 0.2));
        var txHook = (EV.lift0 <= t && t < EV.release) ? sun_state(t).x : tx;
        return { tx: tx, txHook: txHook, hy: hy, open: clamp(open) };
      }
      function roller_state(t) {
        var n = BANDS.length, bp = [], dirs = [], i;
        for (i = 0; i < n; i++) { var s0 = EV.paint0 + i * EV.paint_step; bp.push(E.io(prog(t, s0, s0 + EV.paint_dur))); dirs.push(i % 2 === 0 ? 1 : -1); }
        var active = EV.paint0 - 0.45 <= t && t <= EV.paint0 + (n - 1) * EV.paint_step + EV.paint_dur + 0.5;
        if (!active) return { bp: bp, dirs: dirs, roller: null };
        for (i = 0; i < n; i++) {
          var s = EV.paint0 + i * EV.paint_step, yr = band_rect(i), cy = i < n - 1 ? (yr[0] + yr[1]) / 2 : 150;
          var front = dirs[i] < 0 ? W + 30 - bp[i] * (W + 60) : -30 + bp[i] * (W + 60);
          front = clamp(front, 110, W - 110);
          if (t < s) {
            var prevEnd = i === 0 ? EV.paint0 - 0.45 : s - EV.paint_step + EV.paint_dur, u = E.io(prog(t, prevEnd, s));
            var startX = dirs[i] > 0 ? 110 : W - 110;
            if (i === 0) return { bp: bp, dirs: dirs, roller: ["extend", u, startX, cy] };
            var pr = band_rect(i - 1);
            return { bp: bp, dirs: dirs, roller: ["paint", startX, lerp((pr[0] + pr[1]) / 2, cy, u)] };
          }
          if (t <= s + EV.paint_dur) return { bp: bp, dirs: dirs, roller: ["paint", front, cy] };
        }
        var end = EV.paint0 + (n - 1) * EV.paint_step + EV.paint_dur;
        return { bp: bp, dirs: dirs, roller: ["retract", E.io(prog(t, end, end + 0.5)), dirs[n - 1] < 0 ? 110 : W - 110, 150] };
      }
      var JAR_X = 520, JAR_Y = FG_Y - 80;
      function jar_state(t) {
        var x = JAR_X, y = JAR_Y, rot = 0;
        if (t >= EV.bump) rot = 0.16 * Math.sin(2 * Math.PI * 3.2 * (t - EV.bump)) * (0.4 + prog(t, EV.bump, EV.tip));
        if (t >= EV.tip) { var u = prog(t, EV.tip, EV.crash); rot = lerp(0.16, 1.57, E.in(u)); x = lerp(JAR_X + 22, JAR_X + 85, u); y = lerp(JAR_Y, FG_Y - 26, E.in(u)); }
        if (t >= EV.crash) { var b = t - EV.crash; rot = 1.57 - 0.08 * damped(b, 3, 7); x = JAR_X + 85; y = FG_Y - 26 - 6 * Math.abs(damped(b, 2.5, 8)); }
        return { x: x, y: y, rot: rot };
      }
      var CAM = [[0.0, 470, 1300, 1.50], [4.1, 500, 1300, 1.45], [5.9, 540, 960, 1.0], [9.4, 540, 960, 1.0],
        [10.3, 580, 1050, 1.15], [13.4, 560, 1000, 1.15], [14.8, 540, 1250, 1.38], [15.9, 560, 1300, 1.45],
        [16.6, 580, 1180, 1.3], [17.8, 540, 960, 1.0], [18.0, 540, 960, 1.0], [19.1, 565, 1340, 1.62], [20.0, 565, 1340, 1.66]];
      function camera(t) {
        var c = CAM[CAM.length - 1].slice(1);
        for (var i = 0; i < CAM.length - 1; i++) if (CAM[i][0] <= t && t <= CAM[i + 1][0]) {
          var u = E.io(prog(t, CAM[i][0], CAM[i + 1][0])); c = [1, 2, 3].map(function (j) { return lerp(CAM[i][j], CAM[i + 1][j], u); }); break;
        }
        var z = c[2], hw = W / (2 * z), hh = H / (2 * z);
        return [clamp(c[0], hw, W - hw), clamp(c[1], hh, H - hh), z];
      }
      function hand_pos(x, y, s, p) {     // screen position of the right hand (pole grip)
        var au = p.arms[2], af = p.arms[3], sh = p.shrug || 0, lean = (p.lean || 0) * D2R;
        var lx = 26 + 25 * Math.sin(au * D2R) + 24 * Math.sin(af * D2R), ly = -94 - sh * 13 + 25 * Math.cos(au * D2R) + 24 * Math.cos(af * D2R);
        return [x + (lx * Math.cos(lean) - ly * Math.sin(lean)) * s, y + (p.bob || 0) + (lx * Math.sin(lean) + ly * Math.cos(lean)) * s * (p.squash || 1)];
      }
      function pole_geometry(t, roller, x2) {
        var base = [x2 + 34, FG_Y - 110], rest = [x2 + 50, FG_Y - 150];
        if (!roller) {
          if (t >= 13.6) { var u = E.io(prog(t, 13.6, 13.85)); return [base, [lerp(rest[0], 262, u), lerp(rest[1], FG_Y - 170, u)]]; }
          return [base, rest];
        }
        if (roller[0] === "extend") return [base, [lerp(rest[0], roller[2], roller[1]), lerp(rest[1], roller[3], roller[1])]];
        if (roller[0] === "retract") return [base, [lerp(roller[2], rest[0], roller[1]), lerp(roller[3], rest[1], roller[1])]];
        return [base, [roller[1], roller[2]]];
      }

      // ------------------------------------------------------------- build the set (once)
      var world = document.getElementById("world"), svgDefs = document.querySelector("#world-svg defs");
      var R = IT.rng(PC.hashKey("paper-factory"));     // one seeded stream for decorative scatter

      // sky: blank page + pencil lines, then the painted bands (revealed by clip)
      paper(world, [[-40, -40], [W + 40, -40], [W + 40, H + 40], [-40, H + 40]], "#e8e0cf", { shadow: false, edge: false });
      for (var k = 0; k < 7; k++) line(world, [[70, 120 + k * 190], [W - 70, 123 + k * 190]], "#8c8073", 1.2, 0.10);
      var bands = BANDS.map(function (c, i) {
        var yr = band_rect(i), y0 = i === BANDS.length - 1 ? -20 : yr[0], y1 = yr[1];
        var clip = el("clipPath", { id: "band" + i }), cr = el("rect", { x: -30, y: y0 - 30, width: 0, height: y1 - y0 + 60 });
        clip.appendChild(cr); svgDefs.appendChild(clip);
        var bg = g(world, { "clip-path": "url(#band" + i + ")" });
        paper(bg, PC.tornPoly("band" + i, [[-20, y0], [W + 20, y0], [W + 20, y1], [-20, y1]], 5.0, 22), c, { depth: 1.2 });
        var r = PC.rngFor("bandstrokes" + i);
        for (var j = 0; j < 9; j++) {
          var yy = y0 + 20 + r() * (y1 - y0 - 40);
          var p = el("path", { d: "M-10 " + yy.toFixed(1) + "C300 " + (yy + r() * 12 - 6).toFixed(1) + " 700 " + (yy + r() * 12 - 6).toFixed(1) + " " + (W + 10) + " " + yy.toFixed(1),
            fill: "none", stroke: PC.shade(c, r() < 0.5 ? -0.06 : 0.08), "stroke-opacity": 0.55, "stroke-width": (6 + r() * 10).toFixed(1) });

      });
      var sunSkyAnchor = g(world);
      // hills + back floor
      var far = [[-20, FLOOR]], near = [[-20, FLOOR]], x;
      for (x = -20; x <= W + 40; x += 60) far.push([x, 1290 - 50 * Math.sin(x / 210 + 0.6) - 25 * Math.sin(x / 90)]);
      for (x = -20; x <= W + 40; x += 50) near.push([x, 1370 - 40 * Math.sin(x / 160 + 2.1) - 14 * Math.sin(x / 55)]);

      for (k = 0; k < 2; k++) paper(world, PC.tornRect("chs" + k, 78, 980 + k * 60, 66, 14, 1), "#f2e6cf", { depth: 0.4 });
      var puffs = [0, 1, 2, 3].map(function (k) { var pg = g(world); return { g: pg, piece: paper(pg, PC.tornCircle("puff" + k, 14, 1.6), "#fbf6ec", { depth: 0.5 }) }; });
      // worker 1 (back plane): pushes the sun out
      var w1 = PC.puppet(g(world), { look: LOOK1, cx: 482, ground: FLOOR, scale: 0.92 });
      // the sun
