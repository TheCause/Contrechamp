# OpenMontage - Global Configuration

llm:
  provider: anthropic            # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: null                    # null = use provider default
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output

# Measured post-render checks (final_review). Defaults were calibrated on real
# renders; tune them to your style. See docs/fork/lot1-checks-that-bite.md.
review:
  glued_word_min_len: 21         # caption token this long = words glued together
  seam_min_ssim: 0.90            # continuity cuts (hold, freeze) must stay above
  seam_max_luma_jump: 4.0        # ... and below this mean-luminance jump (0-255)
  music_max_silence_ratio: 0.05  # music planned: max share of digital silence
  text_match_min: 0.85           # expected on-screen text, loose match floor
  ocr_required: true             # false: missing tesseract no longer blocks "pass"
  loudness_min_lufs: -26         # integrated loudness floor (R128 -23, YouTube -14)
  last_sentence_max_drop_db: 20  # last word this much under the mix = faded (healthy <= 12.5)
